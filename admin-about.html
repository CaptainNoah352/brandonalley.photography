<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin About Photo - Brandon Alley Photography</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css" />
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <header class="admin-header">
      <a class="admin-header-logo" href="index.html">Brandon Alley Photography</a>
      <span class="admin-header-sep" aria-hidden="true">/</span>
      <span class="admin-header-label">About Photo</span>
    </header>

    <div class="admin-controls">
      <a class="admin-control-link" href="admin.html">Numbered site photos</a>
      <span class="admin-count" id="adminCount"></span>
    </div>

    <main>
      <section class="admin-special-section" id="aboutPhotoSection">
        <div class="admin-section-heading">
          <p class="admin-section-eyebrow">Page photo</p>
          <h2>About me photo</h2>
        </div>
        <div class="admin-grid admin-grid--special" id="adminAboutGrid"></div>
      </section>
    </main>

    <footer class="admin-footer">
      <p>This page is only for the About me portrait. It is not part of the numbered gallery photo workflow.</p>
      <p>Photo data lives in <code>photo-data.js</code>.</p>
    </footer>

    <script>
      (function () {
        var cacheBust = Date.now();
        var dataScript = document.createElement("script");
        dataScript.src = "photo-data.js?v=" + cacheBust;
        dataScript.onload = function () {
          var adminScript = document.createElement("script");
          adminScript.src = "admin.js?v=" + cacheBust;
          document.body.appendChild(adminScript);
        };
        document.body.appendChild(dataScript);
      }());
    </script>
  </body>
</html>

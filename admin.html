<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Admin tools for Brandon Alley Photography gallery entries." />
    <title>Admin | Brandon Alley Photography</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="admin">
    <header class="site-header" id="top">
      <div class="header-shell">
        <div class="header-inner">
          <a href="index.html#top" class="logo">Brandon Alley Photography</a>

          <nav class="site-nav" aria-label="Main navigation">
            <a href="index.html#top">Home</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="about.html">About</a>
            <a href="admin.html">Admin</a>
            <a href="index.html#contact">Contact</a>
          </nav>

          <button class="header-burger-btn burger" id="menuToggle" type="button" aria-expanded="false" aria-controls="mobileMenu" aria-label="Open menu">
            <div class="burger-box">
              <div class="burger-inner">
                <div class="top-bun"></div>
                <div class="patty"></div>
              </div>
            </div>
          </button>
        </div>
      </div>
    </header>

    <div class="mobile-menu-overlay" id="mobileMenu" aria-hidden="true">
      <button class="mobile-menu-close" id="mobileMenuClose" type="button" aria-label="Close menu">
        <span aria-hidden="true">&times;</span>
      </button>
      <nav class="mobile-menu-nav" aria-label="Mobile navigation">
        <a href="index.html#top">Home</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="about.html">About</a>
        <a href="admin.html">Admin</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </div>

    <main>
      <section class="section-padding" aria-label="Admin gallery image list">
        <div class="container">
          <div class="portfolio-page-header">
            <p class="eyebrow">Admin</p>
            <h1>Gallery entries</h1>
            <p>Review all configured images and toggle whether each photo is featured.</p>
          </div>
          <div class="admin-grid" id="adminGrid" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>&copy; <span id="year"></span> Brandon | Brandon Alley Photography</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
